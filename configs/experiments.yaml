# Run queue consumed by scripts/run_queue.py. Stages run in order; a stage only starts when asked.
seeds_full: [0, 1, 2, 3, 4]
seeds_heavy: [0, 1, 2]
stages:
  gate1_nih:        # can run before CANDID access (NIH released train/val only)
    - {config: pilot_nih_base, seeds: [0]}
    - {config: pilot_nih_adv,  seeds: [0]}
    - {config: pilot_nih_dro,  seeds: [0]}
  gate1:            # CANDID dev validation only
    - {config: pilot_bl_unet_effb4, seeds: [0]}
    - {config: pilot_abl_base,      seeds: [0]}
    - {config: pilot_full,          seeds: [0]}
  tube_labels:      # pseudo-label chest tubes on SIIM-ACR (trained on CANDID train only)
    - {command: "python -m ptx.data.tube_labels --data {data} --splits splits --dev candid --target siim"}
  main:
    - {config: full,               seeds: seeds_full}
    - {config: abl_no_c1,          seeds: seeds_full}
    - {config: abl_no_c2,          seeds: seeds_full}
    - {config: abl_no_c3,          seeds: seeds_full}
    - {config: abl_no_c4,          seeds: seeds_full}
    - {config: abl_base,           seeds: seeds_full}
    - {config: bl_unet_r34_kaggle, seeds: seeds_full}
    - {config: bl_unet_effb4,      seeds: seeds_full}
    - {config: bl_bandaru_auxcls,  seeds: seeds_full}
    - {config: bl_groupdro,        seeds: seeds_full}
    - {config: bl_raddino_probe,   seeds: seeds_full}
    - {config: bl_raddino_ft,      seeds: seeds_full}
    - {config: bl_segformer_b2,    seeds: seeds_heavy}
    - {config: bl_rueckel_tubeseg, seeds: seeds_heavy}
    - {config: sens_lambda001,     seeds: seeds_heavy}
    - {config: sens_lambda1,       seeds: seeds_heavy}
    - {config: sens_inpaint_mean,  seeds: seeds_heavy}
  gate2:            # opens external sets once, then scores everything
    - {command: "bash scripts/freeze_prereg.sh"}
    - {command: "python -m ptx.data.leakage --data {data} --splits splits --dev candid"}
    - {command: "python -m ptx.evaluate_external --runs results/runs"}
    - {command: "python -m ptx.eval.acceptance --spec configs/acceptance.yaml --runs results/runs --out results"}
  # ---------------- Plan B (no CANDID-PTX): SIIM-ACR development set, NIH + PTX-498 external
  planb_prep:
    - {command: "git pull -q --rebase origin main; python -m ptx.data.device_labels --data {data} --splits splits --target siim --sync && ([ -f splits/siim.csv ] || python -m ptx.data.splits --data {data} --dev siim --externals nih ptx498 --out splits)"}
    - {command: "python scripts/check_masks.py --data {data} --out results/mask_checks"}
  planb_gate1:
    - {config: pilot_pb_base,   seeds: [0]}
    - {config: pilot_pb_no_c2,  seeds: [0]}
    - {config: pilot_pb_full,   seeds: [0]}
  planb_main_a:     # proposed model, ablations, one sensitivity run (pod A)
    - {config: pb_full,               seeds: seeds_full}
    - {config: pb_no_c2,              seeds: seeds_full}
    - {config: pb_no_c4,              seeds: seeds_full}
    - {config: pb_base,               seeds: seeds_full}
    - {config: pb_sens_lambda001,     seeds: seeds_heavy}
  planb_main_b:     # baselines, one sensitivity run (pod B)
    - {config: pb_bl_unet_r34_kaggle, seeds: seeds_full}
    - {config: pb_bl_bandaru_auxcls,  seeds: seeds_full}
    - {config: pb_bl_groupdro,        seeds: seeds_full}
    - {config: pb_bl_raddino_probe,   seeds: seeds_full}
    - {config: pb_bl_raddino_ft,      seeds: seeds_full}
    - {config: pb_bl_segformer_b2,    seeds: seeds_heavy}
    - {config: pb_sens_lambda1,       seeds: seeds_heavy}
  planb_main_b2:    # re-queue after the transformers/torch fix (pod B)
    - {config: pb_bl_raddino_probe,   seeds: seeds_full}
    - {config: pb_bl_raddino_ft,      seeds: seeds_full}
  planb_main_c:     # remaining heavy baseline + sensitivity run (pod C)
    - {config: pb_bl_segformer_b2,    seeds: seeds_heavy}
    - {config: pb_sens_lambda1,       seeds: seeds_heavy}
  planb_gate2:
    - {command: "bash scripts/freeze_prereg.sh"}
    - {command: "mkdir -p results/planb && python -m ptx.data.leakage --data {data} --splits splits --dev siim --out results/planb/leakage_check.json"}
    - {command: "python scripts/fetch_weights.py --runs results/runs"}
    - {command: "python -m ptx.evaluate_external --runs results/runs"}
    - {command: "python -m ptx.eval.acceptance --spec configs/acceptance_planb.yaml --runs results/runs --out results/planb"}
